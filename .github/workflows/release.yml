name: Validate and release versions

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'CHANGELOG.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: versions-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  versions:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/release.py plan
      - name: Require public downloads
        if: github.event_name != 'pull_request' && steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false

  checks:
    needs: [workflow-lint, versions]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Test app and release automation
        run: make test
      - name: Build and verify a development artifact
        env:
          DIORAMA_SIGNING_IDENTITY: '-'
        run: make build
      - name: Verify Sparkle signing and rejection of invalid updates
        run: ./Tests/ReleaseAutomation/check-sparkle.sh
      - name: Archive development app with executable permissions
        run: ditto -c -k --keepParent dist/Diorama.app dist/Diorama-development.zip
      - uses: actions/upload-artifact@v6
        with:
          name: Diorama-development
          path: dist/Diorama-development.zip
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: [versions, checks]
    if: github.repository == 'pdparchitect/diorama' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"
          keychain="$RUNNER_TEMP/diorama-signing.keychain-db"
          certificate="$RUNNER_TEMP/diorama-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          print -rn -- "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            print -u2 "The imported archive does not contain a Developer ID Application identity."
            exit 1
          fi
          print "DIORAMA_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          print "DIORAMA_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          umask 077
          : "${APP_STORE_CONNECT_API_KEY_P8:?Missing APP_STORE_CONNECT_API_KEY_P8 secret}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID secret}"
          key="$RUNNER_TEMP/diorama-notarization.p8"
          print -rn -- "$APP_STORE_CONNECT_API_KEY_P8" > "$key"
          chmod 600 "$key"
          print "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          print "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          print "APPLE_API_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Prepare update-signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing SPARKLE_PRIVATE_KEY secret}"
          umask 077
          key="$RUNNER_TEMP/diorama-update.key"
          print -rn -- "$SPARKLE_PRIVATE_KEY" > "$key"
          print "SPARKLE_PRIVATE_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify the update feed
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Diorama-release-${{ needs.versions.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: zsh {0}
        run: |
          rm -f "$RUNNER_TEMP/diorama-update.key" "$RUNNER_TEMP/diorama-signing.p12" "$RUNNER_TEMP/diorama-notarization.p8"
          if [[ -f "$RUNNER_TEMP/diorama-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/diorama-signing.keychain-db"
          fi

  publish:
    needs: [versions, checks, prepare]
    if: github.repository == 'pdparchitect/diorama' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: Diorama-release-${{ needs.versions.outputs.version }}
          path: dist/release
      - name: Mint the checked tag and publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish
